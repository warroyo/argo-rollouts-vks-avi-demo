# Argo Rollouts dashboard (upstream manifest, pinned), patched for VKS + AKO:
# PodSecurity "restricted" + an Istio sidecar so AVI (ako-istio) can reach it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argo-rollouts

resources:
  - https://github.com/argoproj/argo-rollouts/releases/download/v1.10.1/dashboard-install.yaml
  - gateway.yaml

patches:
  - path: deployment-patch.yaml
