apiVersion: apps/v1
kind: Deployment
metadata:
  name: argo-rollouts-dashboard
spec:
  template:
    metadata:
      labels:
        # Inject only this pod; argo-rollouts namespace has no istio-injection label.
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: argo-rollouts-dashboard
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
