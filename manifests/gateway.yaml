# Hostname is a placeholder: set yours in an overlay (see local.example/).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rollouts-demo
spec:
  gatewayClassName: avi-lb
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "rollouts-demo.example.com"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rollouts-demo
spec:
  parentRefs:
  - name: rollouts-demo
  hostnames:
  - "rollouts-demo.example.com"
  rules:
  # Argo Rollouts (gatewayAPI plugin) rewrites these weights at each canary step.
  - backendRefs:
    - name: rollouts-demo-stable
      port: 80
      weight: 100
    - name: rollouts-demo-canary
      port: 80
      weight: 0
